upstream fastapi_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com; # Thay bằng domain thực tế

    # Giới hạn dung lượng tải file PDF, DOCX
    client_max_body_size 50M;

    # Timeout cho tác vụ AI inference dài
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    access_log /var/log/nginx/academic_checker_access.log;
    error_log /var/log/nginx/academic_checker_error.log;

    location / {
        proxy_pass http://fastapi_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}

